<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Studio</title>
<style>
/* ==== theme.css ==== */
/* ============================================================================
   theme.css — design tokens ONLY. Nothing here selects an element.

   Every colour is declared three times, in this order:
     1. bare  :root                                         -> light palette
     2. @media (prefers-color-scheme: dark) :root:not([data-theme="light"])
     3. :root[data-theme="dark"]
   so the in-page toggle wins in both directions (a user on a dark OS who picks
   "light" keeps light, a user on a light OS who picks "dark" gets dark), and no
   colour has its ONLY definition inside a media query.

   `color-scheme` rides along with each palette: it is what makes native
   scrollbars, the file picker and form controls match the page.
   ========================================================================= */

:root {
  color-scheme: light;

  /* --- surfaces: a real elevation ladder, sunken < bg < elev -------------- */
  --bg-sunken:    #e9ebef;   /* troughs: status bar, table headers, wells    */
  --bg:           #f4f6f8;   /* the app's resting surface                    */
  --bg-elev:      #ffffff;   /* raised paper: toolbar, preview, dialogs      */

  /* --- lines ------------------------------------------------------------- */
  --border:        #dde1e7;
  --border-strong: #c0c6cf;

  /* --- text (AA against --bg, --bg-elev and --bg-sunken) ------------------ */
  --text:      #16181d;      /* 16.9:1 on white                              */
  --text-dim:  #5c6470;      /*  5.9:1 on white, 4.8:1 on --bg-sunken        */

  /* --- accent ------------------------------------------------------------ */
  --accent:      #2a5fd6;    /*  5.6:1 on white, 4.8:1 on --accent-weak      */
  --accent-weak: #e6edfd;    /* tint behind an active control                */
  --accent-text: #ffffff;    /* text drawn ON a solid --accent fill          */

  /* --- semantic ---------------------------------------------------------- */
  --danger: #c0362c;         /*  4.9:1 on white                              */
  --warn:   #8a5a00;         /*  5.9:1 on white                              */
  --ok:     #12704a;         /*  6.1:1 on white                              */

  /* --- code + marks ------------------------------------------------------ */
  --code-bg:   #f0f2f5;
  --code-text: #22262e;
  --mark:      #ffe9a8;
  --sel:       #cfe0ff;

  /* --- depth ------------------------------------------------------------- */
  --shadow: 0 1px 2px rgb(16 22 32 / .07), 0 10px 30px rgb(16 22 32 / .11);

  /* --- spacing: 4 / 8 / 12 / 16 / 24 / 32 -------------------------------- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;

  /* --- type scale: 12 / 13.5 / 15 / 17 / 20 / 26 / 34 -------------------- */
  --fs-1: 12px;
  --fs-2: 13.5px;
  --fs-3: 15px;
  --fs-4: 17px;
  --fs-5: 20px;
  --fs-6: 26px;
  --fs-7: 34px;

  /* --- font stacks: system faces only, never a webfont ------------------- */
  --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
           "Noto Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  --mono:  ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas,
           "Liberation Mono", "Roboto Mono", "Courier New", monospace;
  --serif: ui-serif, Georgia, Cambria, "Iowan Old Style", "Palatino Linotype",
           "Times New Roman", Times, serif;
  /* Stretchy fences need a font carrying an OpenType MATH table with glyph size
     variants — without one, `\left(` around a 2-row pmatrix stays a normal
     13.8px paren next to a 38.5px matrix (measured in Chromium). Naming the
     faces is what fixes it: the generic `math` keyword alone did NOT resolve to
     an installed math font. Every entry here ships with an OS or a TeX install,
     so this stays a system-font stack and nothing is ever downloaded.
     STIXTwoMath.otf is present on macOS in /System/Library/Fonts/Supplemental. */
  --math:  "STIX Two Math", "Latin Modern Math", "Cambria Math",
           "TeX Gyre Termes Math", "DejaVu Math TeX Gyre", math, var(--serif);

  /* --- geometry ---------------------------------------------------------- */
  --radius:    7px;
  --radius-lg: 12px;
  --maxw:      76ch;         /* reading measure, ~66-80 characters           */
}

/* ---------------------------------------------------------------------------
   Dark — a warm graphite, not an inverted white. Red sits a shade above blue
   in every surface so the page reads like paper under lamplight rather than a
   terminal, and the ladder stays honest: sunken < bg < elev.
   ------------------------------------------------------------------------ */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --bg-sunken: #131211;
    --bg:        #1b1a19;
    --bg-elev:   #232220;

    --border:        #34322e;
    --border-strong: #4d4944;

    --text:     #eae7e2;       /* 13.7:1 on --bg                            */
    --text-dim: #a49f97;       /*  6.5:1 on --bg                            */

    --accent:      #7fa8ff;    /*  7.3:1 on --bg, 6.1:1 on --accent-weak    */
    --accent-weak: #222a3a;
    --accent-text: #12141a;    /* dark ink on the light accent fill         */

    --danger: #f4867c;
    --warn:   #e0b450;
    --ok:     #6fd39b;

    --code-bg:   #191817;
    --code-text: #e6e2db;
    --mark:      #5a4a1f;
    --sel:       #33415e;

    --shadow: 0 1px 2px rgb(0 0 0 / .55), 0 12px 34px rgb(0 0 0 / .5);
  }
}

/* Same palette, forced by the toolbar toggle regardless of OS preference. */
:root[data-theme="dark"] {
  color-scheme: dark;

  --bg-sunken: #131211;
  --bg:        #1b1a19;
  --bg-elev:   #232220;

  --border:        #34322e;
  --border-strong: #4d4944;

  --text:     #eae7e2;
  --text-dim: #a49f97;

  --accent:      #7fa8ff;
  --accent-weak: #222a3a;
  --accent-text: #12141a;

  --danger: #f4867c;
  --warn:   #e0b450;
  --ok:     #6fd39b;

  --code-bg:   #191817;
  --code-text: #e6e2db;
  --mark:      #5a4a1f;
  --sel:       #33415e;

  --shadow: 0 1px 2px rgb(0 0 0 / .55), 0 12px 34px rgb(0 0 0 / .5);
}

/* ---------------------------------------------------------------------------
   Print — paper is white whatever the screen was doing. This block is last and
   its selectors carry at least the specificity of the two dark blocks, so it
   wins over both; without it, printing from dark mode yields near-white text.
   ------------------------------------------------------------------------ */
@media print {
  :root,
  :root:not([data-theme="light"]),
  :root[data-theme="dark"],
  :root[data-theme="light"] {
    color-scheme: light;

    --bg-sunken: #f2f3f5;
    --bg:        #ffffff;
    --bg-elev:   #ffffff;

    --border:        #cfd4da;
    --border-strong: #9aa1aa;

    --text:     #000000;
    --text-dim: #4a505a;

    --accent:      #1a4bb5;
    --accent-weak: #eef2fc;
    --accent-text: #ffffff;

    --danger: #a52b22;
    --warn:   #7a4f00;
    --ok:     #0d5f3e;

    --code-bg:   #f4f5f7;
    --code-text: #16181d;
    --mark:      #ffefb8;
    --sel:       transparent;

    --shadow: none;
  }
}

/* ==== app.css ==== */
/* ============================================================================
   app.css — the chrome. Toolbar, pane grid, gutter, outline, status bar,
   drop overlay, help dialog, focus rings, print.

   Everything reads a token from theme.css; the only literals here are opacity,
   geometry and the modal scrim (see the note on ::backdrop).
   ========================================================================= */

/* --- reset ---------------------------------------------------------------- */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--sans);
  font-size: var(--fs-3);
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;                    /* the page never scrolls; panes do    */
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

/* One ring, everywhere, on keyboard focus only. */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
:focus:not(:focus-visible) { outline: none; }

/* Thin scrollbars that follow the palette. */
#editor, #editor-pane, #preview-pane, #outline {
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
#editor::-webkit-scrollbar,
#editor-pane::-webkit-scrollbar,
#preview-pane::-webkit-scrollbar,
#outline::-webkit-scrollbar { width: 11px; height: 11px; }
#editor::-webkit-scrollbar-track,
#editor-pane::-webkit-scrollbar-track,
#preview-pane::-webkit-scrollbar-track,
#outline::-webkit-scrollbar-track { background: transparent; }
#editor::-webkit-scrollbar-thumb,
#editor-pane::-webkit-scrollbar-thumb,
#preview-pane::-webkit-scrollbar-thumb,
#outline::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border: 3px solid transparent;
  border-radius: 99px;
  background-clip: content-box;
}
#editor:hover::-webkit-scrollbar-thumb,
#preview-pane:hover::-webkit-scrollbar-thumb { background-clip: content-box; }

/* --- app shell ------------------------------------------------------------ */

#app {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100vh;
  height: 100dvh;
  background: var(--bg);
  isolation: isolate;
}

/* ============================================================================
   Toolbar
   ========================================================================= */

#toolbar {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 48px;
  padding: var(--sp-2) var(--sp-3);
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  /* Narrow windows scroll the toolbar rather than wrapping it into two rows. */
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
#toolbar::-webkit-scrollbar { display: none; }

.tb-group {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  flex: 0 0 auto;
}
.tb-right { margin-left: auto; }

.tb-brand {
  gap: var(--sp-2);
  padding-right: var(--sp-2);
  margin-right: var(--sp-1);
  border-right: 1px solid var(--border);
  color: var(--text);
}
.logo {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.brand-name {
  font-size: var(--fs-2);
  font-weight: 600;
  letter-spacing: .01em;
  white-space: nowrap;
}

/* --- buttons -------------------------------------------------------------- */

/* Ghost by default. Nine identically-weighted outlined pills read as a settings
   panel, and made the segmented mode group a box inside a box; the verbs sit
   flat until the pointer approaches, so the bar has exactly two boxes -- the
   mode group and whichever toggle is pressed -- and the accent chip actually
   reads as state. The border is transparent rather than absent so nothing
   shifts by a pixel on hover. */
#toolbar button {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: 30px;
  padding: 5px 10px;
  font-size: var(--fs-2);
  font-weight: 500;
  color: var(--text);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius);
  white-space: nowrap;
  cursor: pointer;
  transition: background .13s ease, border-color .13s ease, color .13s ease;
}
#toolbar button:hover {
  background: var(--bg-sunken);
  border-color: var(--border);
}
#toolbar button:active { background: var(--bg-sunken); }
#toolbar button:disabled {
  opacity: .45;
  cursor: default;
  background: transparent;
  border-color: transparent;
}

/* Active / pressed: an accent chip. Works for #btn-outline and any toggle. */
#toolbar button[aria-pressed="true"],
#toolbar button.is-active {
  color: var(--accent);
  background: var(--accent-weak);
  border-color: var(--accent-weak);
}
#toolbar button[aria-pressed="true"]:hover,
#toolbar button.is-active:hover {
  background: var(--accent-weak);
  border-color: var(--accent);
}

#btn-help {
  width: 30px;
  padding: 0;
  justify-content: center;
  font-weight: 700;
  color: var(--text-dim);
}
#btn-help:hover { color: var(--text); }

/* --- segmented mode group ------------------------------------------------- */

#mode-group {
  gap: 0;
  padding: 2px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
#toolbar #mode-group button {
  min-height: 26px;
  padding: 4px 12px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: calc(var(--radius) - 2px);
  color: var(--text-dim);
}
#toolbar #mode-group button:hover {
  color: var(--text);
  background: var(--bg-sunken);
  border-color: transparent;
}
#toolbar #mode-group button[aria-pressed="true"],
#toolbar #mode-group button.is-active {
  color: var(--accent);
  background: var(--bg-elev);
  border-color: var(--border);
  box-shadow: inset 0 0 0 1px var(--accent-weak);
}

/* --- theme dot ------------------------------------------------------------ */

.theme-dot {
  width: 9px;
  height: 9px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--text-dim);
  box-shadow: inset 0 0 0 1px var(--border-strong);
}
:root[data-theme="light"] .theme-dot { background: var(--warn); }
:root[data-theme="dark"]  .theme-dot { background: var(--accent); }
:root[data-theme="system"] .theme-dot {
  background: linear-gradient(90deg, var(--text-dim) 0 50%, var(--bg-elev) 50% 100%);
}
#theme-label { font-variant-numeric: tabular-nums; }

/* ============================================================================
   Panes

   `#panes` is a grid. #outline carries the `hidden` attribute, and a
   display:none element is not a grid item at all, so the column count changes
   with it -- hence the `:has()` variants below rather than one fixed template.
   `--split` / `--split-rest` are the editor and reader columns, and they must
   stay in `fr`. A PERCENTAGE grid track resolves against the whole grid content
   box -- including the 232px outline column -- so a 57.2% editor put the divider
   133px right of the pointer whenever the outline was open, drifting further the
   further you dragged. `fr` distributes only what is left after the fixed
   outline column and the auto gutter, which is the region app.js measures the
   ratio over. `1fr`/`1fr` gives an even split until a drag says otherwise.
   ========================================================================= */

#panes {
  --outline-w: 232px;
  --split: 1fr;
  --split-rest: 1fr;
  display: grid;
  grid-template-columns: minmax(0, var(--split)) auto minmax(0, var(--split-rest));
  min-height: 0;
  background: var(--bg);
}
#panes:has(> #outline:not([hidden])) {
  grid-template-columns: var(--outline-w) minmax(0, var(--split)) auto minmax(0, var(--split-rest));
}

/* Edit: editor only. */
#app[data-mode="edit"] #panes { grid-template-columns: minmax(0, 1fr); }
#app[data-mode="edit"] #panes:has(> #outline:not([hidden])) {
  grid-template-columns: var(--outline-w) minmax(0, 1fr);
}
#app[data-mode="edit"] #gutter,
#app[data-mode="edit"] #preview-pane { display: none; }

/* Read: preview only, centred by #preview's own max-width. */
#app[data-mode="read"] #panes { grid-template-columns: minmax(0, 1fr); }
#app[data-mode="read"] #panes:has(> #outline:not([hidden])) {
  grid-template-columns: var(--outline-w) minmax(0, 1fr);
}
#app[data-mode="read"] #gutter,
#app[data-mode="read"] #editor-pane { display: none; }

/* Fallback for engines without :has(): float the outline over the editor
   instead of letting it steal the first grid column. */
@supports not selector(:has(*)) {
  #panes { position: relative; }
  #outline:not([hidden]) {
    position: absolute;
    inset-block: 0;
    inset-inline-start: 0;
    width: var(--outline-w);
    z-index: 3;
    box-shadow: var(--shadow);
  }
}

#editor-pane, #preview-pane {
  min-width: 0;
  min-height: 0;
}

#editor-pane {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  box-shadow: inset 2px 0 0 transparent;
  transition: box-shadow .13s ease;
}
#editor-pane:focus-within { box-shadow: inset 2px 0 0 var(--accent); }

#editor {
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  display: block;
}

#preview-pane {
  display: block;                      /* a scroll container, not a flex box */
  background: var(--bg-elev);
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--sp-5) var(--sp-5) 30vh;
  scroll-padding-top: var(--sp-4);
}
#app[data-mode="read"] #preview-pane {
  padding: var(--sp-6) var(--sp-5) 40vh;
}
/* With the outline open the reader's measure centres inside the LEFTOVER space,
   which put it ~116px right of the window centre and read as visibly
   off-centre. Balancing the outline column on the trailing side puts the
   measure back on the window's midline. Only where there is room to spare:
   below this width the column needs every pixel. */
@media (min-width: 1000px) {
  #app[data-mode="read"] #panes:has(> #outline:not([hidden])) > #preview-pane {
    padding-inline-end: calc(var(--sp-5) + var(--outline-w));
  }
}
#preview {
  max-width: var(--maxw);
  margin-inline: auto;
}

/* --- gutter --------------------------------------------------------------- */

#gutter {
  position: relative;
  width: 11px;
  cursor: col-resize;
  background: transparent;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
#gutter::before {
  content: "";
  position: absolute;
  inset-block: 0;
  left: 50%;
  width: 1px;
  transform: translateX(-50%);
  background: var(--border);
  transition: background .13s ease, width .13s ease;
}
#gutter:hover::before,
#gutter:focus-visible::before,
#gutter[data-dragging]::before {
  width: 3px;
  background: var(--accent);
}
#gutter:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
/* app.js adds this to <body> for the length of a gutter drag. Without it the
   pointer flickered back to a text caret the moment it left the 11px gutter and
   the drag selected the editor's text on the way past. */
body.is-resizing { cursor: col-resize; }
body.is-resizing * {
  -webkit-user-select: none;
  user-select: none;
}

/* ============================================================================
   Outline
   ========================================================================= */

#outline {
  min-width: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 var(--sp-2) var(--sp-6);
  background: var(--bg);
  border-right: 1px solid var(--border);
}
/* #outline sets its own display, so the UA's [hidden] rule must be restated. */
#outline[hidden] { display: none; }

.outline-head {
  position: sticky;
  top: 0;
  z-index: 1;
  padding: var(--sp-3) var(--sp-2) var(--sp-2);
  margin-bottom: var(--sp-1);
  font-size: var(--fs-1);
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

#toc, #toc ol {
  list-style: none;
  margin: 0;
  padding: 0;
}
/* Depth comes from the level ladder below and nowhere else: a nested-<ol>
   padding on top of it compounds, so an h1 -> h3 (a skipped level) would indent
   LESS than an h1 -> h2 -> h3 even though both are three deep. */
#toc ol { padding-left: 0; }

/* Indent by level. app.js writes both data-level and .lvl-N; .level-N is kept
   as a third spelling. All feed one local --indent so only the padding rule
   knows about it. */
#toc li { --indent: 0px; }
#toc li[data-level="2"], #toc li.lvl-2, #toc li.level-2 { --indent: var(--sp-3); }
#toc li[data-level="3"], #toc li.lvl-3, #toc li.level-3 { --indent: var(--sp-5); }
#toc li[data-level="4"], #toc li.lvl-4, #toc li.level-4 { --indent: 36px; }
#toc li[data-level="5"], #toc li.lvl-5, #toc li.level-5 { --indent: 48px; }
#toc li[data-level="6"], #toc li.lvl-6, #toc li.level-6 { --indent: 60px; }

#toc a {
  display: block;
  padding: 4px var(--sp-2);
  padding-left: calc(var(--sp-2) + var(--indent));
  font-size: var(--fs-2);
  line-height: 1.35;
  color: var(--text-dim);
  text-decoration: none;
  border-radius: var(--radius);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: background .13s ease, color .13s ease;
}
#toc a:hover { color: var(--text); background: var(--bg-sunken); }
#toc li[data-level="1"] > a, #toc li.lvl-1 > a, #toc li.level-1 > a {
  font-weight: 600;
  color: var(--text);
}
#toc a.is-active,
#toc li.is-active > a,
#toc a[aria-current] {
  color: var(--accent);
  background: var(--accent-weak);
  font-weight: 600;
}

/* ============================================================================
   Status bar
   ========================================================================= */

#statusbar {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  min-height: 28px;
  padding: 4px var(--sp-3);
  font-size: var(--fs-1);
  color: var(--text-dim);
  background: var(--bg-sunken);
  border-top: 1px solid var(--border);
  white-space: nowrap;
  overflow: hidden;
}
#status-name {
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
}
/* The stats are the only expendable child: #status-name identifies the document
   and #status-msg is the app's ONLY error channel -- "binary file", "too large",
   "clipboard blocked", "autosave off" all land there. Unprioritised, the stats
   ate 290px of a 680px bar and truncated a 69-character warning. */
#status-stats {
  font-variant-numeric: tabular-nums;
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
#status-msg {
  flex: 1 1 auto;
  min-width: 0;
  margin-left: auto;
  text-align: right;
  color: var(--accent);
  overflow: hidden;
  text-overflow: ellipsis;
}
#status-msg:empty { display: none; }
#status-msg[data-kind="error"] { color: var(--danger); }
#status-msg[data-kind="warn"]  { color: var(--warn); }
#status-msg[data-kind="ok"]    { color: var(--ok); }

/* ============================================================================
   Drop overlay
   ========================================================================= */

#drop {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: var(--sp-6);
}
#drop[hidden] { display: none; }        /* id beats the UA [hidden] rule      */
#drop::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--bg);
  opacity: .84;
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
}
.drop-card {
  position: relative;
  z-index: 1;
  padding: var(--sp-6) calc(var(--sp-6) * 2);
  font-size: var(--fs-5);
  font-weight: 600;
  color: var(--text);
  text-align: center;
  background: var(--bg-elev);
  border: 2px dashed var(--accent);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  animation: drop-in .16s ease-out;
}
@keyframes drop-in {
  from { opacity: 0; transform: scale(.97); }
  to   { opacity: 1; transform: none; }
}

/* ============================================================================
   Help dialog
   ========================================================================= */

#help {
  width: min(560px, calc(100vw - var(--sp-6) * 2));
  max-height: min(80vh, 640px);
  padding: var(--sp-5);
  color: var(--text);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: auto;
}
/* ::backdrop only inherits custom properties from its originating element in
   newer engines, so a token here would resolve differently per browser. A
   single neutral scrim is the honest choice; it suits both palettes. */
#help::backdrop {
  background: rgb(10 11 14 / .48);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
}
#help h2 {
  margin: 0 0 var(--sp-4);
  font-size: var(--fs-5);
  font-weight: 650;
  letter-spacing: -.01em;
}
#help-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-2);
}
#help-table td, #help-table th {
  padding: 6px var(--sp-2);
  text-align: left;
  vertical-align: baseline;
  border-bottom: 1px solid var(--border);
}
#help-table tr:last-child td { border-bottom: 0; }
/* The key column shrink-wraps so the description gets the room. */
#help-table td:first-child, #help-table th:first-child {
  width: 1%;
  padding-left: 0;
  white-space: nowrap;
}
#help-table td:last-child { padding-right: 0; }
#help-table kbd, #help kbd {
  display: inline-block;
  min-width: 1.7em;
  padding: 2px 6px;
  font-family: var(--mono);
  font-size: var(--fs-1);
  line-height: 1.4;
  text-align: center;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 5px;
}
#help footer {
  display: flex;
  justify-content: flex-end;
  margin-top: var(--sp-5);
}
#help footer button {
  min-height: 30px;
  padding: 5px 14px;
  font-size: var(--fs-2);
  font-weight: 550;
  color: var(--accent-text);
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  cursor: pointer;
}
#help footer button:hover { filter: brightness(1.08); }

/* ============================================================================
   Narrow windows — the toolbar sheds labels before it sheds controls.
   ========================================================================= */

@media (max-width: 900px) {
  .brand-name { display: none; }
  #panes { --outline-w: 200px; }
}
@media (max-width: 720px) {
  #theme-label { display: none; }
  #toolbar { gap: var(--sp-2); }
  .tb-brand { border-right: 0; padding-right: 0; margin-right: 0; }
  #preview-pane,
  #app[data-mode="read"] #preview-pane { padding-inline: var(--sp-4); }
  /* The message needs the whole bar at this width; the counts do not. */
  #status-stats { display: none; }
}

/* Below ~700px a split gives two ~230px columns: the editor wraps prose after
   three words and the reader after five, so the same paragraph is read twice in
   two unreadable measures. Collapse to the reader and leave the STORED
   preference alone, so widening the window brings the split straight back. */
@media (max-width: 700px) {
  #app[data-mode="split"] #panes {
    grid-template-columns: minmax(0, 1fr);
  }
  #app[data-mode="split"] #panes:has(> #outline:not([hidden])) {
    grid-template-columns: var(--outline-w) minmax(0, 1fr);
  }
  #app[data-mode="split"] #editor-pane,
  #app[data-mode="split"] #gutter { display: none; }
}

/* Below ~560px the eleven controls need 700px of row. Wrapping is the only
   option that sheds nothing: scrolling them behind `scrollbar-width: none` put
   four controls -- including the theme toggle and the help button -- off-screen
   with nothing on screen to say they were there, and sliced the Outline button
   mid-word, which reads as a broken layout rather than as "scroll me". */
@media (max-width: 560px) {
  #toolbar {
    flex-wrap: wrap;
    row-gap: var(--sp-2);
    overflow-x: visible;
  }
  .tb-right { margin-left: 0; }
}

/* ============================================================================
   Reduced motion — keep the state changes, drop the movement.
   ========================================================================= */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ============================================================================
   Print — one clean document: no chrome, no editor, full width, free-flowing.
   Palette is forced light by theme.css's own @media print block.
   ========================================================================= */

@page { margin: 18mm 16mm; }

@media print {
  html, body {
    height: auto;
    overflow: visible;
    background: var(--bg);
  }

  #toolbar,
  #statusbar,
  #outline,
  #gutter,
  #editor-pane,
  #drop,
  #help { display: none !important; }

  #app {
    display: block;
    height: auto;
    background: var(--bg);
  }

  /* Every mode prints the reader. */
  #panes,
  #app[data-mode="edit"] #panes,
  #app[data-mode="read"] #panes,
  #app[data-mode="split"] #panes {
    display: block;
    overflow: visible;
  }

  #preview-pane,
  #app[data-mode="edit"] #preview-pane,
  #app[data-mode="read"] #preview-pane {
    display: block;
    overflow: visible;
    padding: 0;
    background: var(--bg);
  }

  #preview {
    max-width: none;
    margin: 0;
  }
}

/* ==== markdown.css ==== */
/* ============================================================================
   markdown.css — typography of the rendered document (#preview.markdown-body),
   the editor textarea's own type, and ::selection.

   Class names markdown.js / app.js may emit are matched generously, because the
   renderer is free to pick any of the usual spellings: heading anchors are
   `.md-anchor`, code-copy buttons are matched as `.md-copy`, `.md-code-copy`,
   `.copy-btn`, `[data-copy]` or a bare `button` inside the block, and tables
   work whether or not they carry `.md-table`.
   ========================================================================= */

/* --- selection ------------------------------------------------------------ */

::selection {
  background: var(--sel);
  color: var(--text);
}

/* ============================================================================
   The editor
   ========================================================================= */

#editor {
  padding: var(--sp-5) var(--sp-5) 40vh;
  font-family: var(--mono);
  font-size: var(--fs-3);
  line-height: 1.68;
  tab-size: 2;
  -moz-tab-size: 2;
  color: var(--text);
  background: transparent;
  border: 0;
  border-radius: 0;
  outline: none;                       /* the pane's inset edge shows focus  */
  resize: none;                        /* no drag handle in a pane layout    */
  overflow: auto;                      /* the textarea owns its own scroll   */
  caret-color: var(--accent);
  white-space: pre-wrap;
  overflow-wrap: break-word;
  -webkit-font-smoothing: auto;
}
#editor::placeholder {
  color: var(--text-dim);
  opacity: .75;
}
@media (max-width: 720px) {
  #editor { padding-inline: var(--sp-4); }
}

/* ============================================================================
   Document base
   ========================================================================= */

.markdown-body {
  font-family: var(--sans);
  font-size: var(--fs-3);
  line-height: 1.7;
  color: var(--text);
  overflow-wrap: break-word;
  font-variant-numeric: tabular-nums lining-nums;
  text-underline-offset: 2px;
}
/* Reader mode gets the larger measure. Add data-font="serif" on #preview for
   the optional serif reading face; the sans stack stays the default. */
#app[data-mode="read"] .markdown-body { font-size: var(--fs-4); }
.markdown-body[data-font="serif"] { font-family: var(--serif); }

.markdown-body > :first-child { margin-top: 0; }
.markdown-body > :last-child { margin-bottom: 0; }

.markdown-body p { margin: 0 0 1.05em; }

.markdown-body strong { font-weight: 650; }
.markdown-body em { font-style: italic; }
.markdown-body del, .markdown-body s { color: var(--text-dim); }

.markdown-body mark, .markdown-body .md-mark {
  padding: .06em .22em;
  color: var(--text);
  background: var(--mark);
  border-radius: 3px;
}

.markdown-body abbr[title] {
  text-decoration: underline dotted var(--border-strong);
  cursor: help;
}

.markdown-body small { font-size: var(--fs-2); color: var(--text-dim); }

/* ============================================================================
   Headings — a clear ramp, with a hairline under h1/h2 only.
   ========================================================================= */

.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4,
.markdown-body h5,
.markdown-body h6 {
  position: relative;
  margin: 1.9em 0 .62em;
  font-weight: 650;
  line-height: 1.25;
  letter-spacing: -.011em;
  color: var(--text);
  scroll-margin-top: var(--sp-4);
}

.markdown-body h1 {
  margin-top: 0;
  font-size: var(--fs-7);
  font-weight: 700;
  letter-spacing: -.022em;
  padding-bottom: .28em;
  border-bottom: 1px solid var(--border);
}
/* No rule here. h1 AND h2 both carrying a hairline striped every real document
   -- three horizontal lines in one screen, competing with the <hr> gradient a
   few paragraphs down. The size ramp and the extra space above carry the
   hierarchy; the h1's rule stays as the document's only horizontal line. */
.markdown-body h2 {
  margin-top: 2.3em;
  font-size: var(--fs-6);
  letter-spacing: -.017em;
}
.markdown-body h3 { font-size: var(--fs-5); }
.markdown-body h4 { font-size: var(--fs-4); }
.markdown-body h5 { font-size: var(--fs-3); }
.markdown-body h6 {
  font-size: var(--fs-2);
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.markdown-body h1 + h2,
.markdown-body h2 + h3,
.markdown-body h3 + h4 { margin-top: 1.1em; }

/* Heading anchor: hangs in the left margin, invisible until the heading is
   hovered or the link itself is focused. `:empty` covers a renderer that emits
   an anchor with no text of its own. */
.markdown-body .md-anchor {
  position: absolute;
  left: -.85em;
  top: 0;
  width: .8em;
  font-weight: 400;
  color: var(--text-dim);
  text-decoration: none;
  opacity: 0;
  transition: opacity .13s ease, color .13s ease;
}
.markdown-body .md-anchor:empty::before { content: "#"; }
.markdown-body h1:hover .md-anchor,
.markdown-body h2:hover .md-anchor,
.markdown-body h3:hover .md-anchor,
.markdown-body h4:hover .md-anchor,
.markdown-body h5:hover .md-anchor,
.markdown-body h6:hover .md-anchor,
.markdown-body .md-anchor:focus-visible { opacity: 1; }
.markdown-body .md-anchor:hover { color: var(--accent); }

/* ============================================================================
   Links
   ========================================================================= */

.markdown-body a {
  color: var(--accent);
  text-decoration-line: underline;
  text-decoration-thickness: 1px;
  text-decoration-color: var(--accent);
  transition: text-decoration-thickness .1s ease;
}
.markdown-body a:hover { text-decoration-thickness: 2px; }
.markdown-body a:visited { color: var(--accent); }
.markdown-body a code { color: inherit; }

/* ============================================================================
   Lists
   ========================================================================= */

.markdown-body ul,
.markdown-body ol {
  margin: 0 0 1.05em;
  padding-left: 1.5em;
}
.markdown-body li { margin: .28em 0; }
.markdown-body li > ul,
.markdown-body li > ol { margin: .3em 0 .35em; }
.markdown-body li::marker { color: var(--text-dim); }
/* Loose lists: the renderer wraps items in <p>. Keep the rhythm tight inside. */
.markdown-body li > p { margin: 0 0 .55em; }
.markdown-body li > p:last-child { margin-bottom: 0; }

/* Task lists — checkbox sits on the text baseline, bullet removed. */
.markdown-body li.task-list-item,
.markdown-body li.md-task {
  list-style: none;
  margin-left: -1.35em;
  padding-left: 1.35em;
}
/* Kept as its own rule: an engine without :has() drops the whole rule it
   appears in, and the class-based fallback above must survive that. */
.markdown-body li:has(> input[type="checkbox"]),
.markdown-body li:has(> p > input[type="checkbox"]:first-child) {
  list-style: none;
  margin-left: -1.35em;
  padding-left: 1.35em;
}
.markdown-body li input[type="checkbox"] {
  width: 1em;
  height: 1em;
  margin: 0 .45em 0 -1.35em;
  vertical-align: -.1em;
  accent-color: var(--accent);
}
.markdown-body li input[type="checkbox"]:disabled { opacity: 1; }
.markdown-body li input[type="checkbox"]:checked + * { color: var(--text-dim); }

/* Definition lists (raw HTML passes straight through). */
.markdown-body dl { margin: 0 0 1.05em; }
.markdown-body dt { font-weight: 650; margin-top: .7em; }
.markdown-body dd { margin: .2em 0 0 1.3em; color: var(--text-dim); }

/* ============================================================================
   Blockquotes
   ========================================================================= */

.markdown-body blockquote {
  margin: 1.3em 0;
  padding: .1em 0 .1em var(--sp-4);
  color: var(--text-dim);
  border-left: 3px solid var(--accent);
}
.markdown-body blockquote > :last-child { margin-bottom: 0; }
.markdown-body blockquote blockquote {
  margin: .7em 0;
  border-left-color: var(--border-strong);
}
.markdown-body blockquote cite {
  display: block;
  margin-top: .5em;
  font-size: var(--fs-2);
  font-style: normal;
}

/* ============================================================================
   Code
   ========================================================================= */

.markdown-body code,
.markdown-body kbd,
.markdown-body samp {
  font-family: var(--mono);
  font-size: .885em;
  font-variant-ligatures: none;
}

.markdown-body :not(pre) > code {
  padding: .14em .36em;
  color: var(--code-text);
  background: var(--code-bg);
  border-radius: 5px;
  overflow-wrap: break-word;
}

.markdown-body kbd {
  padding: .12em .4em;
  color: var(--text);
  background: var(--bg-sunken);
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 5px;
}

/* The block itself is the positioning context for its copy button; a wrapper
   is honoured too, whichever the renderer produced. */
.markdown-body pre,
.markdown-body .md-pre,
.markdown-body .md-code,
.markdown-body .md-code-wrap,
.markdown-body .md-codeblock { position: relative; }

.markdown-body pre {
  margin: 1.3em 0;
  padding: var(--sp-3) var(--sp-4);
  font-size: var(--fs-2);
  line-height: 1.58;
  color: var(--code-text);
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  tab-size: 2;
  -moz-tab-size: 2;
}
.markdown-body pre code {
  display: block;
  padding: 0;
  font-size: inherit;
  color: inherit;
  background: none;
  border: 0;
  white-space: pre;
  overflow-wrap: normal;
}

/* Copy button: top-right, only on hover / keyboard focus inside the block. */
.markdown-body .md-copy,
.markdown-body .md-code-copy,
.markdown-body .copy-btn,
.markdown-body [data-copy],
.markdown-body pre > button,
.markdown-body .md-pre > button,
.markdown-body .md-code-wrap > button {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 2;
  padding: 3px 8px;
  font-family: var(--sans);
  font-size: var(--fs-1);
  font-weight: 550;
  line-height: 1.5;
  color: var(--text-dim);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  opacity: 0;
  transition: opacity .13s ease, color .13s ease, border-color .13s ease;
}
.markdown-body pre:hover .md-copy,
.markdown-body pre:hover .md-code-copy,
.markdown-body pre:hover .copy-btn,
.markdown-body pre:hover [data-copy],
.markdown-body pre:hover > button,
.markdown-body pre:focus-within .md-copy,
.markdown-body pre:focus-within > button,
.markdown-body .md-pre:hover .md-copy,
.markdown-body .md-pre:hover > button,
.markdown-body .md-code-wrap:hover .md-copy,
.markdown-body .md-code-wrap:hover > button,
.markdown-body .md-copy:focus-visible,
.markdown-body .md-code-copy:focus-visible,
.markdown-body .copy-btn:focus-visible,
.markdown-body [data-copy]:focus-visible { opacity: 1; }

.markdown-body .md-copy:hover,
.markdown-body .md-code-copy:hover,
.markdown-body .copy-btn:hover,
.markdown-body [data-copy]:hover,
.markdown-body pre > button:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.markdown-body .md-copy.is-done,
.markdown-body .copy-btn.is-done,
.markdown-body [data-copy].is-done {
  color: var(--ok);
  border-color: var(--ok);
  opacity: 1;
}

/* ============================================================================
   Tables — the wrap scrolls so a wide table never widens the page.
   ========================================================================= */

.markdown-body .md-table-wrap {
  margin: 1.35em 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.markdown-body .md-table-wrap > table,
.markdown-body .md-table-wrap > .md-table { margin: 0; border: 0; }

.markdown-body table,
.markdown-body .md-table {
  width: 100%;
  margin: 1.35em 0;
  font-size: var(--fs-2);
  line-height: 1.5;
  border-collapse: collapse;
  border-spacing: 0;
  background: var(--bg-elev);
}

.markdown-body th,
.markdown-body td {
  padding: 7px var(--sp-3);
  text-align: left;                    /* inline text-align from the         */
  vertical-align: top;                 /* alignment row overrides this       */
  border-bottom: 1px solid var(--border);
}

.markdown-body thead th,
.markdown-body th {
  font-weight: 650;
  color: var(--text);
  white-space: nowrap;
  background: var(--bg-sunken);
  border-bottom: 1px solid var(--border-strong);
}
.markdown-body thead th { position: relative; }

/* Zebra: one step down the elevation ladder, so it survives both palettes. */
.markdown-body tbody tr:nth-child(even) > td { background: var(--bg); }
.markdown-body tbody tr:last-child > td { border-bottom: 0; }
.markdown-body tbody tr:hover > td { background: var(--accent-weak); }

.markdown-body td > code { white-space: pre-wrap; }
.markdown-body caption {
  padding-bottom: var(--sp-2);
  font-size: var(--fs-2);
  color: var(--text-dim);
  text-align: left;
}

/* ============================================================================
   Rules, media, figures
   ========================================================================= */

.markdown-body hr {
  height: 1px;
  margin: var(--sp-6) 0;
  border: 0;
  background: linear-gradient(90deg,
    transparent, var(--border) 12%, var(--border) 88%, transparent);
}

.markdown-body img,
.markdown-body svg,
.markdown-body video {
  max-width: 100%;
  height: auto;
  vertical-align: middle;
  border-radius: var(--radius);
}
.markdown-body p > img:only-child { display: block; margin-inline: auto; }

.markdown-body figure {
  margin: 1.5em 0;
  text-align: center;
}
.markdown-body figcaption {
  margin-top: var(--sp-2);
  font-size: var(--fs-2);
  color: var(--text-dim);
}

.markdown-body details {
  margin: 1.2em 0;
  padding: var(--sp-3) var(--sp-4);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.markdown-body summary {
  font-weight: 600;
  cursor: pointer;
}
.markdown-body details[open] > summary { margin-bottom: var(--sp-3); }

/* ============================================================================
   Footnotes — small, dim, set apart by a rule.
   ========================================================================= */

.markdown-body .footnotes,
.markdown-body .md-footnotes {
  margin-top: var(--sp-6);
  padding-top: var(--sp-4);
  font-size: var(--fs-2);
  color: var(--text-dim);
  border-top: 1px solid var(--border);
}
.markdown-body .footnotes h2,
.markdown-body .md-footnotes h2,
.markdown-body .footnotes h3,
.markdown-body .md-footnotes h3 {
  margin: 0 0 var(--sp-2);
  padding: 0;
  font-size: var(--fs-2);
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 0;
}
.markdown-body .footnotes ol,
.markdown-body .md-footnotes ol { padding-left: 1.4em; }
.markdown-body .footnotes li,
.markdown-body .md-footnotes li { margin: .35em 0; }
.markdown-body .footnotes li:target,
.markdown-body .md-footnotes li:target {
  background: var(--accent-weak);
  border-radius: var(--radius);
}

.markdown-body sup, .markdown-body sub {
  font-size: .74em;
  line-height: 0;
}
.markdown-body .footnote-ref,
.markdown-body .md-fnref,
.markdown-body sup > a {
  padding: 0 .1em;
  text-decoration: none;
  font-weight: 600;
}
.markdown-body .footnote-ref:hover,
.markdown-body .md-fnref:hover,
.markdown-body sup > a:hover { text-decoration: underline; }
.markdown-body .footnote-backref,
.markdown-body .md-fnback { text-decoration: none; }

/* ============================================================================
   Math (MathML Core from tex.js)
   ========================================================================= */

.markdown-body math {
  /* var(--math) is load-bearing, not decoration: without a font carrying an
     OpenType MATH table, \left( \right) and the matrix/cases fences do not
     stretch to their content. See the token's note in theme.css. */
  font-family: var(--math);
  font-size: 1.12em;
  color: inherit;
}
/* Display math. `display` is deliberately NOT set: the UA gives <math> an inner
   `math` display, and forcing `display:block` here drops it back to normal
   inline layout — measured, a long formula then WRAPPED like a paragraph.
   Centring is `fit-content` + auto margins (the UA centres it too, but not
   every engine does); the box still fills the column when the formula is wider
   than it, so an over-long equation scrolls instead of widening the page. */
.markdown-body math[display="block"] {
  width: fit-content;
  max-width: 100%;
  margin: var(--sp-5) auto;
  padding-block: var(--sp-1);
  text-align: center;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
}
.markdown-body .md-math-block {
  display: block;
  margin: var(--sp-5) 0;
  text-align: center;
  overflow-x: auto;
  overflow-y: hidden;
}
.markdown-body .md-math-block > math[display="block"] {
  margin-block: 0;
  overflow: visible;
}
.markdown-body math[display="inline"] { overflow: visible; }

/* No math renderer supplied: the source shows as literal code. */
.markdown-body .md-math-raw {
  padding: .14em .36em;
  font-family: var(--mono);
  font-size: .885em;
  color: var(--text-dim);
  background: var(--code-bg);
  border: 1px dashed var(--border-strong);
  border-radius: 5px;
}

/* A formula tex.js could not parse: visible red source, never a blank page. */
.markdown-body .md-math-error {
  display: inline-block;
  max-width: 100%;
  padding: .1em .35em;
  font-family: var(--mono);
  font-size: .885em;
  color: var(--danger);
  background: var(--code-bg);
  border: 1px solid var(--danger);
  border-radius: 5px;
  overflow-x: auto;
  white-space: pre-wrap;
}

/* A command tex.js recognised but does not implement. */
.markdown-body .md-tex-unknown {
  color: var(--warn);
  font-family: var(--mono);
  font-size: .92em;
  border-bottom: 1px dotted var(--warn);
}

/* ============================================================================
   Print — remove the affordances, keep the document.
   ========================================================================= */

@media print {
  .markdown-body {
    font-size: 11pt;
    line-height: 1.55;
  }
  .markdown-body h1 { font-size: 21pt; }
  .markdown-body h2 { font-size: 16pt; }
  .markdown-body h3 { font-size: 13pt; }
  .markdown-body h4,
  .markdown-body h5,
  .markdown-body h6 { font-size: 11pt; }

  .markdown-body .md-anchor,
  .markdown-body .md-copy,
  .markdown-body .md-code-copy,
  .markdown-body .copy-btn,
  .markdown-body [data-copy],
  .markdown-body pre > button { display: none !important; }

  .markdown-body a {
    color: var(--text);
    text-decoration-color: var(--border-strong);
  }

  .markdown-body pre,
  .markdown-body blockquote,
  .markdown-body .md-table-wrap,
  .markdown-body table,
  .markdown-body figure,
  .markdown-body img,
  .markdown-body math[display="block"] { break-inside: avoid; }

  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3,
  .markdown-body h4 { break-after: avoid; }

  .markdown-body pre { white-space: pre-wrap; overflow: visible; }
  .markdown-body .md-table-wrap { overflow: visible; }
  .markdown-body tbody tr:hover > td { background: none; }
}
</style>

<script>
/* ==== markdown.js ==== */
/* markdown.js — window.MD
 *
 * A hand-written CommonMark-core + GFM renderer with first-class support for
 * GFM tables and TeX math. Zero dependencies; no DOM access; pure string in,
 * string out, deterministic (same input -> byte-identical output).
 *
 * Pipeline, in order:
 *   1. normalise      line endings, tabs, NULs, optional YAML front matter
 *   2. math extraction  BEFORE anything else, masked against code
 *   3. definitions    link references + footnote definitions lifted out
 *   4. block pass     fence / html / heading / hr / quote / list / table /
 *                     indented code / paragraph, recursing into containers
 *   5. inline pass    escapes, code spans, autolinks, links, images, a real
 *                     delimiter-run emphasis algorithm, strike, mark, breaks
 *   6. math substitution — opts.math(tex, display) at the very end
 *
 * DELIBERATELY NOT SUPPORTED (out of scope, and it degrades to literal text
 * rather than failing):
 *   - the full CommonMark HTML-block taxonomy (types 1..7). A block-level tag
 *     runs to the next blank line; <script>/<style>/<pre>/<!--…--> run to their
 *     close. Attribute values containing ">" will cut a tag short.
 *   - link reference definitions that do not begin a block, multi-line
 *     destinations, and titles more than one line below the destination.
 *   - image-inside-link alt reconstruction beyond a simple text strip. (A
 *     link inside a link label IS suppressed, CommonMark-style: the inner-most
 *     definition wins and the outer brackets stay literal.)
 *   - entity *validation*: any well-formed-looking &name; / &#nn; / &#xNN; is
 *     passed through as written, not resolved against the HTML5 entity table.
 *   - CommonMark's exact tab-stop semantics inside partially consumed markers
 *     (tabs are expanded to 4-column stops up front instead).
 *   - definition lists, abbreviations, admonitions, [[wikilinks]], emoji
 *     shortcodes, and any other non-GFM extension.
 *   - YAML front matter is stripped, not rendered.
 *   - `~` fences are inline-inert: "~~~" in a paragraph is literal text.
 */
(function () {
  'use strict';

  var VERSION = '1';

  /* ------------------------------------------------------------------ *
   * escaping / small helpers
   * ------------------------------------------------------------------ */

  var HTML_ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return HTML_ESC[c]; });
  }

  var ATTR_ESC = escapeHtml;

  function unescapeHtml(s) {
    return String(s)
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/&amp;/g, '&');
  }

  var PUNCT_RE = /[!-\/:-@\[-`{-~]/;

  function isAsciiPunct(c) { return !!c && PUNCT_RE.test(c); }

  function isPunctChar(c) {
    if (!c) return false;
    if (isAsciiPunct(c)) return true;
    return /[¡-¿‐-‧‰-⁞、-〃〈-】！-／]/.test(c);
  }

  function isWsChar(c) { return !c || c === ' ' || c === '\t' || c === '\n' || c === '\u000b' || c === '\f' || c === '\r'; }

  function isBlank(line) { return !/[^ \t]/.test(line); }

  function indentOf(line) {
    var i = 0;
    while (i < line.length && line.charAt(i) === ' ') i++;
    return i;
  }

  function rep(s, n) { return n > 0 ? new Array(n + 1).join(s) : ''; }

  /* ------------------------------------------------------------------ *
   * block-level regexes
   * ------------------------------------------------------------------ */

  var RE_FENCE = /^( {0,3})(`{3,}|~{3,})[ \t]*(.*)$/;
  var RE_ATX = /^ {0,3}(#{1,6})(?:[ \t]+([^\n]*?))?[ \t]*$/;
  var RE_HR = /^ {0,3}(?:(?:\*[ \t]*){3,}|(?:-[ \t]*){3,}|(?:_[ \t]*){3,})$/;
  var RE_BQ = /^ {0,3}>/;
  var RE_SETEXT = /^ {0,3}(=+|-+)[ \t]*$/;
  var RE_HTML_TAG_LINE = /^ {0,3}(?:<\/?[a-zA-Z][a-zA-Z0-9-]*(?:\s[^>]*)?\/?>|<!--|<\?|<![A-Za-z]|<!\[CDATA\[)/;
  var RE_HTML_RAW_OPEN = /^ {0,3}<(script|style|pre|textarea)\b/i;
  var RE_LIST_BULLET = /^( {0,3})([-+*])([ \t]+|$)/;
  var RE_LIST_ORDERED = /^( {0,3})(\d{1,9})([.)])([ \t]+|$)/;
  var MATH_TOKEN_RE = /\u0000MATH(\d+)\u0000/g;
  /* Sticky, and deliberately only the plain-tag alternative of inline()'s HTML
   * matcher: comments / PIs / CDATA are masked by codeMask's line pass, so
   * this can never lazily scan a whole document hunting for a `-->`. */
  var RE_TAG_MASK = /<\/?[a-zA-Z][a-zA-Z0-9\-]*(?:\s+[a-zA-Z_:][a-zA-Z0-9_.:\-]*(?:\s*=\s*(?:[^\s"'=<>`]+|'[^']*'|"[^"]*"))?)*\s*\/?>/y;

  /* ------------------------------------------------------------------ *
   * 1. normalisation
   * ------------------------------------------------------------------ */

  function expandTabs(line) {
    if (line.indexOf('\t') < 0) return line;
    var out = '';
    for (var i = 0; i < line.length; i++) {
      var c = line.charAt(i);
      if (c === '\t') {
        var pad = 4 - (out.length % 4);
        out += rep(' ', pad);
      } else out += c;
    }
    return out;
  }

  function normalise(src) {
    var s = String(src == null ? '' : src);
    /* A leading BOM would make the first `#` non-initial and silently demote
     * the document's only h1 to a paragraph. Blob.text() and FileReader strip
     * it, but clipboardData.getData('text/plain') does not, so a pasted file
     * arrives here with it still attached. */
    if (s.charCodeAt(0) === 0xfeff) s = s.slice(1);
    s = s.replace(/\r\n?/g, '\n');
    s = s.replace(/\u0000/g, '\ufffd');
    var lines = s.split('\n');
    for (var i = 0; i < lines.length; i++) lines[i] = expandTabs(lines[i]);
    return lines.join('\n');
  }

  function stripFrontMatter(src) {
    if (src.slice(0, 4) !== '---\n') return src;
    var lines = src.split('\n');
    var limit = Math.min(lines.length, 200);
    var sawPair = false;
    for (var i = 1; i < limit; i++) {
      var l = lines[i];
      if (l === '---' || l === '...') {
        return sawPair ? lines.slice(i + 1).join('\n') : src;
      }
      if (isBlank(l)) continue;
      if (/^\s*#/.test(l)) continue;
      if (/^\s*[-A-Za-z_][\w.\- ]*\s*:(\s|$)/.test(l)) { sawPair = true; continue; }
      if (/^\s+/.test(l) || /^\s*-\s/.test(l)) continue;
      return src;
    }
    return src;
  }

  /* ------------------------------------------------------------------ *
   * 2. math extraction
   * ------------------------------------------------------------------ */

  /* Mark every character that lives inside code — fenced blocks, indented
   * code blocks and inline code spans — so no math delimiter is ever seen
   * inside one, plus the two places raw HTML makes a `$` literal: a raw-text
   * block (<pre>/<script>/<style>/<textarea>, and comments) and the inside of
   * a tag, where a substituted token would inject markup into an attribute
   * value. Conservative on purpose: when in doubt a character is NOT code,
   * because a missed mask only means math where a dollar was meant. */
  function codeMask(src) {
    var n = src.length;
    var mask = new Uint8Array(n);
    var lines = src.split('\n');
    var offsets = [];
    var pos = 0, i;
    for (i = 0; i < lines.length; i++) { offsets.push(pos); pos += lines[i].length + 1; }

    var fence = null;
    var rawHtml = null;
    var inList = false;
    var prevBlank = true;

    function markLine(idx) {
      var start = offsets[idx];
      var end = start + lines[idx].length;
      for (var k = start; k < end; k++) mask[k] = 1;
    }

    for (i = 0; i < lines.length; i++) {
      var line = lines[i];
      var blank = isBlank(line);
      var m;
      /* A raw-text HTML block reaches parseHtmlBlock verbatim, so its body is
       * never markdown — `export P=$HOME/$USER` inside <pre> is shell, not a
       * formula. Same span parseHtmlBlock consumes, same close test. */
      if (rawHtml) {
        markLine(i);
        if (rawHtml.test(line)) rawHtml = null;
        prevBlank = blank;
        continue;
      }
      if (fence) {
        markLine(i);
        m = /^ {0,3}(`{3,}|~{3,})[ \t]*$/.exec(line);
        if (m && m[1].charAt(0) === fence.ch && m[1].length >= fence.len) fence = null;
        prevBlank = blank;
        continue;
      }
      m = RE_FENCE.exec(line);
      if (m && !(m[2].charAt(0) === '`' && m[3].indexOf('`') >= 0)) {
        fence = { ch: m[2].charAt(0), len: m[2].length };
        markLine(i);
        prevBlank = blank;
        continue;
      }
      m = RE_HTML_RAW_OPEN.exec(line);
      if (m) {
        var closeRe = new RegExp('</' + m[1] + '\\s*>', 'i');
        markLine(i);
        if (!closeRe.test(line)) rawHtml = closeRe;
        prevBlank = blank;
        continue;
      }
      if (/^ {0,3}<!--/.test(line)) {
        markLine(i);
        if (line.indexOf('-->') < 0) rawHtml = /-->/;
        prevBlank = blank;
        continue;
      }
      if (!blank) {
        if (matchItemStart(line)) inList = true;
        else if (indentOf(line) === 0 && prevBlank) inList = false;
      }
      if (!blank && !inList && indentOf(line) >= 4 && (prevBlank || mask[offsets[i - 1] || 0])) {
        markLine(i);
      }
      prevBlank = blank;
    }

    /* inline code spans, across the unmasked regions */
    i = 0;
    while (i < n) {
      if (mask[i] || src.charAt(i) !== '`') { i++; continue; }
      var k = 1;
      while (i + k < n && src.charAt(i + k) === '`' && !mask[i + k]) k++;
      var p = i + k, found = -1;
      while (p < n) {
        if (mask[p]) { p++; continue; }
        if (src.charAt(p) === '`') {
          var q = p;
          while (q < n && src.charAt(q) === '`' && !mask[q]) q++;
          if (q - p === k) { found = p; break; }
          p = q;
        } else p++;
      }
      if (found < 0) { i += k; continue; }
      for (var j = i; j < found + k; j++) mask[j] = 1;
      i = found + k;
    }

    /* HTML tags, across what is left. A token substituted inside an attribute
     * value does not merely read wrong: `title="<code class="md-math-raw">…`
     * makes the browser invent an attribute and spill the rest as text. */
    i = 0;
    while (i < n) {
      if (mask[i] || src.charAt(i) !== '<') { i++; continue; }
      RE_TAG_MASK.lastIndex = i;
      var tm = RE_TAG_MASK.exec(src);
      if (!tm) { i++; continue; }
      var stop = i + tm[0].length;
      for (var t = i; t < stop; t++) mask[t] = 1;
      i = stop;
    }
    return mask;
  }

  function pushMath(state, tex, display, raw) {
    var idx = state.math.length;
    /* Display math is routinely written on its own lines inside the
     * delimiters; hand the renderer the formula, not the layout. */
    if (display) tex = tex.replace(/^[ \t\n]+|[ \t\n]+$/g, '');
    state.math.push({ tex: tex, display: display, raw: raw });
    return '\u0000MATH' + idx + '\u0000';
  }

  /* `\(` / `\[` are also the CommonMark escapes for a literal bracket, so a
   * body of nothing but backslashes and space is treated as escapes, not as an
   * empty formula — otherwise `\(\)` and `\[\\\]` vanish into a math span. */
  function isMathBody(body) {
    return /[^\\\s]/.test(body);
  }

  /* A line the math scan may not cross into. Deliberately wider than
   * isBlockStart, which predates GFM tables: a stray `$` on one line and a
   * `($y)` in a table cell below it were enough to swallow the whole table. */
  function stopsMath(line) {
    if (isBlockStart(line)) return true;
    if (/^ {0,3}\|/.test(line)) return true;
    return RE_SETEXT.test(line);
  }

  function extractMath(src, state) {
    var mask = codeMask(src);
    var n = src.length;
    var out = [];
    var i = 0;

    /* Bounds. An unmatched delimiter used to scan to end of document, which
     * both swallowed every heading after it into one math span and made the
     * scan O(occurrences x length) — 1.1 s for a single keystroke on an 80 KB
     * document. TeX itself forbids a blank line inside math, so a blank line
     * is the hard ceiling for a display delimiter, and an inline one stops at
     * the first line that opens a new block as well. */
    var mlines = src.split('\n');
    var paraEnds = [];
    var blockEnds = [];
    var mpos = 0, li;
    for (li = 0; li < mlines.length; li++) {
      if (li > 0) {
        if (isBlank(mlines[li])) paraEnds.push(mpos - 1);
        else if (stopsMath(mlines[li])) blockEnds.push(mpos - 1);
      }
      mpos += mlines[li].length + 1;
    }

    /* first boundary at or after `from`; n when there is none */
    function ceilingIn(arr, from) {
      var lo = 0, hi = arr.length;
      while (lo < hi) {
        var mid = (lo + hi) >> 1;
        if (arr[mid] < from) lo = mid + 1; else hi = mid;
      }
      return lo < arr.length ? arr[lo] : n;
    }

    function displayLimit(from) { return ceilingIn(paraEnds, from); }

    function inlineLimit(from) {
      var a = ceilingIn(paraEnds, from);
      var b = ceilingIn(blockEnds, from);
      return a < b ? a : b;
    }

    /* Every unmasked position of each closing delimiter, indexed once. The old
     * indexOf-per-attempt scanned the whole tail even when the answer was
     * "nowhere", which is where the quadratic came from. */
    var occ = Object.create(null);
    function occurrences(needle) {
      var list = occ[needle];
      if (list) return list;
      list = [];
      var p = 0;
      while (p >= 0 && p <= n - needle.length) {
        p = src.indexOf(needle, p);
        if (p < 0) break;
        if (!mask[p]) list.push(p);
        p += 1;
      }
      occ[needle] = list;
      return list;
    }

    /* The first unmasked `needle` at or after `from` that ends at or before
     * `limit`; -1 when the block holds none. */
    function findUnmasked(needle, from, limit) {
      var list = occurrences(needle);
      var lo = 0, hi = list.length;
      while (lo < hi) {
        var mid = (lo + hi) >> 1;
        if (list[mid] < from) lo = mid + 1; else hi = mid;
      }
      if (lo >= list.length) return -1;
      var p = list[lo];
      return p + needle.length <= limit ? p : -1;
    }

    while (i < n) {
      if (mask[i]) { out.push(src.charAt(i)); i++; continue; }
      var c = src.charAt(i);

      if (c === '\\') {
        var nx = src.charAt(i + 1);
        if (nx === '(') {
          var e = findUnmasked('\\)', i + 2, inlineLimit(i + 2));
          if (e > 0 && isMathBody(src.slice(i + 2, e))) {
            out.push(pushMath(state, src.slice(i + 2, e), false, src.slice(i, e + 2)));
            i = e + 2; continue;
          }
        } else if (nx === '[') {
          var e2 = findUnmasked('\\]', i + 2, displayLimit(i + 2));
          if (e2 > 0 && isMathBody(src.slice(i + 2, e2))) {
            out.push(pushMath(state, src.slice(i + 2, e2), true, src.slice(i, e2 + 2)));
            i = e2 + 2; continue;
          }
        }
        out.push(c);
        if (i + 1 < n) out.push(nx);
        i += 2;
        continue;
      }

      if (c === '$') {
        if (src.charAt(i + 1) === '$') {
          var d = findUnmasked('$$', i + 2, displayLimit(i + 2));
          if (d > 0) {
            var body = src.slice(i + 2, d);
            if (isMathBody(body)) {
              out.push(pushMath(state, body, true, src.slice(i, d + 2)));
              i = d + 2; continue;
            }
          }
          out.push('$$'); i += 2; continue;
        }
        var after = src.charAt(i + 1);
        if (after && !isWsChar(after)) {
          var lim = inlineLimit(i + 1);
          var p = i + 1, close = -1;
          while (p < lim) {
            var pc = src.charAt(p);
            if (mask[p]) { p++; continue; }
            if (pc === '\\') { p += 2; continue; }
            if (pc === '$') {
              var prev = src.charAt(p - 1);
              var nxt = src.charAt(p + 1);
              if (!isWsChar(prev) && !/[0-9]/.test(nxt) && p > i + 1) { close = p; }
              break;
            }
            p++;
          }
          if (close > 0 && isMathBody(src.slice(i + 1, close))) {
            out.push(pushMath(state, src.slice(i + 1, close), false, src.slice(i, close + 1)));
            i = close + 1; continue;
          }
        }
        out.push('$'); i++; continue;
      }

      out.push(c); i++;
    }
    return out.join('');
  }

  function restoreMathRaw(text, state) {
    if (text.indexOf('\u0000') < 0) return text;
    return text.replace(MATH_TOKEN_RE, function (all, d) {
      var m = state.math[+d];
      return m ? m.raw : all;
    });
  }

  function restoreMathTex(text, state) {
    if (text.indexOf('\u0000') < 0) return text;
    return text.replace(MATH_TOKEN_RE, function (all, d) {
      var m = state.math[+d];
      return m ? m.tex : all;
    });
  }

  function defaultMath(tex, display) {
    return '<code class="md-math-raw">' + escapeHtml(display ? '$$' + tex + '$$' : '$' + tex + '$') + '</code>';
  }

  function substituteMath(html, state) {
    var fn = state.mathFn;

## Mathematics

Every formula below is turned into MathML Core by \`src/tex.js\` and rendered by
the browser itself — no KaTeX, no MathJax, no font to download. Inline maths uses
\`$…$\` or \`\\(…\\)\`; display maths uses \`$$…$$\` or \`\\[…\\]\`.

Inline first: the golden ratio $\\varphi = \\frac{1 + \\sqrt{5}}{2}$ satisfies
$\\varphi^2 = \\varphi + 1$, and for all $\\varepsilon > 0$ there exists
$\\delta > 0$ such that $|f(x) - L| < \\varepsilon$ whenever
$0 < |x - a| < \\delta$.

Display maths sits on its own line and centres itself:

$$
\\int_{-\\infty}^{\\infty} e^{-x^2}\\, dx = \\sqrt{\\pi}
$$

Sums and products take their limits above and below in display mode, beside the
operator inline — compare $\\sum_{k=1}^{n} k$ with

$$
\\sum_{k=1}^{n} k = \\frac{n(n+1)}{2}
\\qquad
\\prod_{i=1}^{n} \\frac{1}{i} = \\frac{1}{n!}
$$

Roots take an optional index, so a cube root is \`\\sqrt[3]{x}\`:

$$
\\sqrt[3]{\\,\\frac{27}{8}\\,} = \\frac{3}{2}
\\qquad
\\lim_{h \\to 0} \\frac{f(x + h) - f(x)}{h} = f'(x)
$$

Matrices and the other environments use \`\\begin{…}\` … \`\\end{…}\`, with \`&\`
between columns and \`\\\\\` between rows:

$$
A = \\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}
\\qquad
A^{-1} = \\frac{1}{\\det A} \\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}
$$

A \`cases\` block for a piecewise definition, with \`\\text{…}\` for the prose in it:

$$
\\operatorname{sgn}(x) = \\begin{cases}
-1 & \\text{if } x < 0 \\\\
0 & \\text{if } x = 0 \\\\
+1 & \\text{if } x > 0
\\end{cases}
$$

An \`aligned\` block lines several steps up on their equals signs:

$$
\\begin{aligned}
(x + y)^2 &= x^2 + 2xy + y^2 \\\\
          &= x^2 + y^2 + 2xy \\\\
\\nabla \\cdot \\mathbf{E} &= \\frac{\\rho}{\\epsilon_0}
\\end{aligned}
$$

Greek letters, blackboard bold, accents and stretchy delimiters all behave:

$$
\\forall \\theta \\in \\mathbb{R}: \\quad
\\hat{u} = \\frac{\\vec{v}}{\\lVert \\vec{v} \\rVert}, \\quad

\\tilde{\\Lambda} = \\left[ \\frac{\\alpha + \\beta}{\\gamma} \\right]^{\\!\\top}

$$

\\quad \\Longrightarrow \\quad
\\Gamma(n) = (n-1)! \\ \\ \\text{for } n \\in \\mathbb{N}
$$
