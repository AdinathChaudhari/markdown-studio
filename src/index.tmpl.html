<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Studio</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app" data-mode="split">

  <header id="toolbar">
    <div class="tb-group tb-brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5h18v13H3z"/><path d="M6 15.5v-7l3 3.5 3-3.5v7"/><path d="M15.5 8.5v5m0 0 2.2-2.4m-2.2 2.4-2.2-2.4"/></svg>
      <span class="brand-name">Markdown Studio</span>
    </div>

    <div class="tb-group">
      <button id="btn-open" type="button" title="Open a markdown file (⌘O)">Open</button>
      <button id="btn-save" type="button" title="Save (⌘S)">Save</button>
      <button id="btn-new" type="button" title="New document">New</button>
      <input id="file-input" type="file" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden>
    </div>

    <div class="tb-group" id="mode-group" role="group" aria-label="View mode">
      <button id="mode-edit" type="button" title="Editor only (⌘\)">Edit</button>
      <button id="mode-split" type="button" title="Split view (⌘\)">Split</button>
      <button id="mode-read" type="button" title="Reader only (⌘\)">Read</button>
    </div>

    <div class="tb-group tb-right">
      <button id="btn-outline" type="button" title="Toggle outline">Outline</button>
      <button id="btn-copy" type="button" title="Copy rendered HTML">Copy HTML</button>
      <button id="btn-print" type="button" title="Print / export PDF (⌘P)">Print</button>
      <button id="btn-help" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
      <button id="btn-theme" type="button" title="Cycle light / dark / system (⌘/)">
        <span class="theme-dot" aria-hidden="true"></span><span id="theme-label">System</span>
      </button>
    </div>
  </header>

  <main id="panes">
    <nav id="outline" aria-label="Document outline" hidden>
      <div class="outline-head">Outline</div>
      <ol id="toc"></ol>
    </nav>

    <section id="editor-pane" aria-label="Markdown source">
      <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off"
        wrap="soft" placeholder="# Start typing&#10;&#10;Drop a .md file anywhere, or press ⌘O."></textarea>
    </section>

    <div id="gutter" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Resize panes"></div>

    <section id="preview-pane" aria-label="Rendered preview">
      <article id="preview" class="markdown-body"></article>
    </section>
  </main>

  <footer id="statusbar">
    <span id="status-name">untitled.md</span>
    <span id="status-stats"></span>
    <span id="status-msg" role="status" aria-live="polite"></span>
  </footer>

  <div id="drop" hidden><div class="drop-card">Drop a markdown file to open</div></div>

  <dialog id="help">
    <h2>Keyboard shortcuts</h2>
    <table id="help-table"></table>
    <footer><button type="button" data-close>Close</button></footer>
  </dialog>

</div>
<script>
/*__JS__*/
</script>
</body>
</html>
